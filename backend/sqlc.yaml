version: "2"
sql:
  - engine: postgresql
    schema:
      - migrations/0001_initial_schema.sql
      - migrations/0002_add_plans_table.sql
      - migrations/0003_add_user_lifecycle.sql
      - migrations/0004_add_admin_accounts.sql
      - migrations/0005_extract_user_plans.sql
      - migrations/0006_add_url_metadata.sql
      - migrations/0007_add_url_tags.sql
    queries: internal/repository/queries
    gen:
      go:
        package: sqlc
        sql_package: pgx/v5
        out: internal/repository/sqlc
        emit_interface: true
        emit_json_tags: false
        emit_prepared_queries: false
        emit_empty_slices: true
        emit_exact_table_names: false
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # short_urls.user_id is nullable in schema today but is never NULL in
          # practice. Override to non-pointer so adapters don't need to deref.
          - column: "short_urls.user_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
