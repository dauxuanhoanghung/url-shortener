version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/repository/queries
    gen:
      go:
        package: sqlc
        sql_package: pgx/v5
        out: internal/repository/sqlc
        emit_interface: true
        emit_json_tags: false
        emit_prepared_queries: false
        emit_empty_slices: true
        emit_exact_table_names: false
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # short_urls.user_id is nullable in schema today but is never NULL in
          # practice (URLs always have an owner). Treat it as non-nullable at
          # the Go boundary so repositories don't need to deref pointers.
          # A later migration will add NOT NULL and this override can be dropped.
          - column: "short_urls.user_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
